<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeralaXplore Quiz Battle - Entry Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .hero-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 550px;
      width: 100%;
    }
    .badge-pill {
      background: linear-gradient(90deg, #ec4899, #8b5cf6);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
    .btn-action {
      border-radius: 14px;
      padding: 14px 24px;
      font-size: 1.1rem;
      font-weight: 700;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-host {
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      border: none;
      color: white;
    }
    .btn-host:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
      color: white;
    }
    .btn-player {
      background: linear-gradient(90deg, #10b981, #059669);
      border: none;
      color: white;
    }
    .btn-player:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4);
      color: white;
    }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center">
    <div class="hero-card text-center">
      <div class="mb-3">
        <span class="badge-pill text-uppercase">⚡ Real-Time Battle Arena</span>
      </div>
      <h1 class="fw-bold mb-3">Live Quiz Battle</h1>
      <p class="text-secondary mb-4">
        Host an interactive trivia competition or join a live room as a player using a 4-digit PIN!
      </p>

      <div class="d-grid gap-3">
        <a href="/host.html" class="btn btn-host btn-action">
          <i class="fa-solid font-awesome fa-crown"></i> Host a Quiz Arena
        </a>
        <a href="/player.html" class="btn btn-player btn-action">
          <i class="fa-solid fa-gamepad"></i> Join as a Player
        </a>
      </div>

      <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-muted small">
        Powered by Node.js &bull; Express.js &bull; Socket.io
      </div>
    </div>
  </div>
</body>
</html>
